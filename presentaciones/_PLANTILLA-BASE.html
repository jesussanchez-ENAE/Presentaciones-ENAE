<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentación Corporativa — ENAE Business School</title>
<script id="presentacion-data" type="application/json">
{
  "slides": [
    {
      "type": "portada_oscura",
      "titulo": "Presentación Corporativa",
      "subtitulo": "ENAE Business School"
    }
  ]
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'SFUIDisplay'; src: url(../assets/fonts/SFUIDisplay-Black.otf) format("opentype"); font-weight: 900; }
  @font-face { font-family: 'SFUIDisplay'; src: url(../assets/fonts/SFUIDisplay-Bold.otf) format("opentype"); font-weight: 700; }
  
  :root {
    --gr: #a91831;
    --ng: #202221;
    --bl: #ffffff;
    --bg-light: #f8f8f8;
  }
  
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    font-family: 'Open Sans', sans-serif;
    background: var(--bg-light);
    color: var(--ng);
    overflow: hidden;
  }
  
  h1, h2, h3, .font-display {
    font-family: 'SFUIDisplay', 'Arial Black', sans-serif;
    letter-spacing: -0.03em;
    margin: 0;
  }
  
  p { margin: 0; }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  
  .slide {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    opacity: 0; pointer-events: none;
    display: flex; flex-direction: column;
    box-sizing: border-box;
  }
  .slide.active {
    opacity: 1; pointer-events: all;
  }
  
  /* Layout: portada_oscura */
  .portada_oscura {
    background: linear-gradient(135deg, #161817, #2c0d15 55%, #1b1d1c);
    color: white; justify-content: center; align-items: center; text-align: center;
  }
  .portada_oscura h1 { font-size: 5vw; color: var(--gr); line-height: 1; margin-bottom: 1.5vw; }
  .portada_oscura h2 { font-size: 2vw; font-weight: 300; color: rgba(255,255,255,0.8); }
  
  /* Layout: texto_dos_fotos */
  .texto_dos_fotos {
    background: var(--bg-light); padding: 5vw 8vw; display: flex; flex-direction: row; align-items: center; gap: 5vw;
  }
  .texto_dos_fotos .content-left { flex: 1.1; }
  .texto_dos_fotos h1 { font-size: 3.5vw; color: var(--gr); line-height: 1.05; margin-bottom: 2.5vw; }
  .texto_dos_fotos .text-cols { display: flex; gap: 2.5vw; font-size: 1.1vw; line-height: 1.6; color: #4a4a4a; }
  .texto_dos_fotos .text-cols > div { flex: 1; }
  .texto_dos_fotos .destacado { font-weight: 700; font-style: italic; color: var(--ng); margin-top: 2.5vw; font-size: 1.3vw; }
  .texto_dos_fotos .photos-right { flex: 0.9; display: flex; flex-direction: column; gap: 2vw; height: 100%; justify-content: center; }
  .texto_dos_fotos .photos-right img { width: 100%; height: 40vh; object-fit: cover; border-radius: 2.5vw; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  .texto_dos_fotos .photo-placeholder { background:#e2e2e2; width: 100%; height: 40vh; border-radius: 2.5vw; }
  
  /* Layout: texto_foto_completa */
  .texto_foto_completa {
    background: white; display: flex; flex-direction: row; height: 100vh;
  }
  .texto_foto_completa .content { flex: 1; padding: 6vw; display: flex; flex-direction: column; justify-content: center; }
  .texto_foto_completa h1 { font-size: 3.5vw; color: var(--gr); margin-bottom: 2vw; line-height: 1.1; }
  .texto_foto_completa p { font-size: 1.2vw; line-height: 1.6; color: #444; white-space: pre-wrap; }
  .texto_foto_completa .photo { flex: 1; position: relative; }
  .texto_foto_completa .photo img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; border-radius: 3vw 0 0 3vw; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
  .texto_foto_completa .photo .photo-placeholder { position: absolute; top:0; left:0; width:100%; height:100%; background: #e2e2e2; border-radius: 3vw 0 0 3vw; }
  
  /* Layout: solo_texto_centrado */
  .solo_texto_centrado {
    background: var(--gr); color: white; justify-content: center; align-items: center; text-align: center; padding: 10vw;
  }
  .solo_texto_centrado h1 { font-size: 4.5vw; line-height: 1.1; margin-bottom: 2vw; }
  .solo_texto_centrado p { font-size: 1.5vw; line-height: 1.5; color: rgba(255,255,255,0.8); max-width: 60vw; margin: 0 auto; }
  
  /* Layout: kpis_metricas */
  .kpis_metricas {
    background: var(--bg-light); padding: 8vw 5vw; display: flex; flex-direction: column; justify-content: center; text-align: center;
  }
  .kpis_metricas h1 { font-size: 3.5vw; color: var(--ng); margin-bottom: 5vw; }
  .kpis_metricas .kpi-grid { display: flex; justify-content: center; gap: 4vw; flex-wrap: wrap; }
  .kpis_metricas .kpi-item { flex: 1; min-width: 15vw; background: white; padding: 3vw 2vw; border-radius: 1.5vw; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
  .kpis_metricas .kpi-item h2 { font-size: 5vw; color: var(--gr); line-height: 1; margin-bottom: 1vw; }
  .kpis_metricas .kpi-item p { font-size: 1vw; font-weight: 700; text-transform: uppercase; color: #888; letter-spacing: 1px; }

  /* Navigation */
  #nav {
    position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); z-index: 200;
    display: flex; gap: 10px; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 50px;
    backdrop-filter: blur(10px);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; border: none; padding: 0; outline: none; transition: all 0.3s ease; }
  .dot:hover { background: rgba(255,255,255,0.7); }
  .dot.active { background: white; transform: scale(1.3); }

</style>
</head>
<body>
<img src="../src/logos/LOGO_ENAE_HORIZONTAL.svg" alt="ENAE" id="logo" style="display: none;" />
<div id="app"></div>
<div id="nav"></div>

<script>
  let currentSlide = 0;
  const dataNode = document.getElementById('presentacion-data');
  const data = JSON.parse(dataNode.textContent || '{"slides":[]}');
  const slides = data.slides || [];
  
  const appEl = document.getElementById('app');
  const navEl = document.getElementById('nav');
  const logoEl = document.getElementById('logo');
  
  function renderSlide(slide, index) {
    let html = '';
    const isActive = '';
    
    if (slide.type === 'portada_oscura') {
      html = `<div class="slide portada_oscura ${isActive}" id="s${index}">
        <h1>${slide.titulo || 'Título de Presentación'}</h1>
        <h2>${slide.subtitulo || ''}</h2>
      </div>`;
    } else if (slide.type === 'texto_dos_fotos') {
      html = `<div class="slide texto_dos_fotos ${isActive}" id="s${index}" data-theme="light">
        <div class="content-left">
          <h1>${slide.titulo || ''}</h1>
          <div class="text-cols">
            <div>${slide.texto_izq || ''}</div>
            <div>${slide.texto_der || ''}</div>
          </div>
          ${slide.destacado ? `<div class="destacado">&gt;&gt;&gt; ${slide.destacado}</div>` : ''}
        </div>
        <div class="photos-right">
          ${slide.foto1 ? `<img src="${slide.foto1}" />` : '<div class="photo-placeholder"></div>'}
          ${slide.foto2 ? `<img src="${slide.foto2}" />` : '<div class="photo-placeholder"></div>'}
        </div>
      </div>`;
    } else if (slide.type === 'texto_foto_completa') {
      html = `<div class="slide texto_foto_completa ${isActive}" id="s${index}" data-theme="light">
        <div class="content">
          <h1>${slide.titulo || ''}</h1>
          <p>${slide.texto || ''}</p>
        </div>
        <div class="photo">
          ${slide.foto ? `<img src="${slide.foto}" />` : '<div class="photo-placeholder"></div>'}
        </div>
      </div>`;
    } else if (slide.type === 'solo_texto_centrado') {
      html = `<div class="slide solo_texto_centrado ${isActive}" id="s${index}" data-theme="dark">
        <h1>${slide.titulo || ''}</h1>
        ${slide.texto ? `<p>${slide.texto}</p>` : ''}
      </div>`;
    } else if (slide.type === 'kpis_metricas') {
      const kpis = slide.kpis || [
        {valor: "1", label: "KPI 1"}, {valor: "2", label: "KPI 2"}, 
        {valor: "3", label: "KPI 3"}, {valor: "4", label: "KPI 4"}
      ];
      const kpiHtml = kpis.map(k => `
        <div class="kpi-item">
          <h2>${k.valor || ''}</h2>
          <p>${k.label || ''}</p>
        </div>
      `).join('');
      
      html = `<div class="slide kpis_metricas ${isActive}" id="s${index}" data-theme="light">
        <h1>${slide.titulo || 'Métricas Clave'}</h1>
        <div class="kpi-grid">
          ${kpiHtml}
        </div>
      </div>`;
    }
    
    return html;
  }
  
  if (slides.length === 0) {
    appEl.innerHTML = '<div class="slide portada_oscura active" style="opacity:1;"><h1>Presentación Vacía</h1></div>';
  } else {
    appEl.innerHTML = slides.map(renderSlide).join('');
    navEl.innerHTML = slides.map((_, i) => `<button class="dot" onclick="goTo(${i})"></button>`).join('');
  }
  
  // Clone logo to each slide
  document.querySelectorAll('.slide').forEach(s => {
    const clone = logoEl.cloneNode(true);
    clone.style.display = 'block';
    clone.style.position = 'absolute';
    clone.style.top = '40px';
    clone.style.right = '40px';
    clone.style.height = '40px';
    clone.style.pointerEvents = 'none';
    if (s.dataset.theme === 'light') clone.style.filter = 'brightness(0)';
    else clone.style.filter = 'brightness(0) invert(1)';
    s.appendChild(clone);
  });
  
  let isExporting = false;

  window.goTo = function(idx) {
    if (isExporting) return;
    
    const prev = document.getElementById('s' + currentSlide);
    const target = document.getElementById('s' + idx);
    const dot = navEl.children[idx];
    
    document.querySelectorAll('.dot').forEach(s => s.classList.remove('active'));
    if (dot) dot.classList.add('active');
    
    if (prev && prev !== target) {
      anime({
        targets: prev,
        opacity: 0,
        duration: 400,
        easing: 'easeInOutQuad',
        complete: () => prev.classList.remove('active')
      });
    }
    
    if (target) {
      target.classList.add('active');
      target.style.opacity = 1;
      
      const animTargets = target.querySelectorAll('h1, h2, p, .text-cols > div, img:not(#logo), .destacado, .kpi-item');
      
      anime.set(animTargets, { opacity: 0, translateY: 30 });
      
      anime({
        targets: animTargets,
        opacity: [0, 1],
        translateY: [30, 0],
        duration: 800,
        delay: anime.stagger(100, {start: 200}),
        easing: 'easeOutExpo'
      });
    }
    
    currentSlide = idx;
  };

  if (slides.length > 0) {
    setTimeout(() => goTo(0), 100);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      if (currentSlide < slides.length - 1) goTo(currentSlide + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (currentSlide > 0) goTo(currentSlide - 1);
    }
  });

  window.exportPdf = function(mode) {
    isExporting = true;
    document.documentElement.style.overflow = 'visible';
    document.body.style.overflow = 'visible';
    appEl.style.overflow = 'visible';
    
    document.querySelectorAll('.slide *').forEach(el => {
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
    
    document.querySelectorAll('.slide').forEach(s => {
      s.classList.add('active');
      s.style.position = 'relative';
      s.style.height = '1080px';
      s.style.width = '1920px';
      s.style.pageBreakAfter = 'always';
      s.style.breakAfter = 'page';
      s.style.opacity = '1';
    });
    navEl.style.display = 'none';
  };
</script>
</body>
</html>
