<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de Presentaciones — ENAE</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
  <style>
    body { font-family: 'Open Sans', sans-serif; background: #f3f4f6; }
    .slide-thumb { border: 2px solid transparent; transition: all 0.2s; }
    .slide-thumb.active { border-color: #a91831; }
  </style>
</head>
<body>
<div id="app" class="flex h-screen overflow-hidden">
  <!-- Sidebar Timeline -->
  <div class="w-72 bg-white border-r flex flex-col z-10 shadow-lg">
    <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
      <a href="/manager.html" class="text-sm font-bold text-gray-700 hover:text-red-700 flex items-center gap-1">
        <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span> Panel
      </a>
      <button @click="savePresentation" class="bg-red-700 hover:bg-red-800 text-white px-4 py-1.5 rounded text-sm font-bold transition-colors shadow-sm">
        Guardar
      </button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
      <div v-for="(slide, idx) in slides" :key="idx" 
           @click="currentSlideIdx = idx"
           class="slide-thumb p-3 bg-white shadow-sm rounded-lg cursor-pointer hover:shadow-md flex justify-between items-center group"
           :class="{'active': currentSlideIdx === idx}">
        <div class="overflow-hidden">
          <div class="text-[10px] text-red-700 uppercase font-bold tracking-wider mb-1">{{ getLayoutName(slide.type) }}</div>
          <div class="text-sm truncate w-40 font-semibold text-gray-800">{{ slide.titulo || 'Sin título' }}</div>
        </div>
        <button @click.stop="removeSlide(idx)" class="text-gray-300 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity">
          <span class="material-symbols-outlined text-sm">delete</span>
        </button>
      </div>
      
      <button @click="showAddModal = true" class="w-full py-3 mt-2 border-2 border-dashed border-gray-300 rounded-lg text-gray-500 hover:text-gray-700 hover:border-gray-400 hover:bg-gray-100 font-bold text-sm transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined">add</span> Añadir Diapositiva
      </button>
    </div>
  </div>

  <!-- Main Editor Area -->
  <div class="flex-1 overflow-y-auto p-8 bg-gray-100 relative">
    
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-xl p-8 border border-gray-100" v-if="currentSlide">
      <div class="flex justify-between items-end border-b border-gray-100 pb-4 mb-6">
        <div>
          <span class="text-xs font-bold text-red-600 uppercase tracking-widest">{{ getLayoutName(currentSlide.type) }}</span>
          <h2 class="text-2xl font-extrabold text-gray-800 mt-1">Editar Diapositiva</h2>
        </div>
        <div class="flex gap-2">
           <button @click="moveSlide(-1)" :disabled="currentSlideIdx === 0" class="p-1.5 border rounded-md hover:bg-gray-50 text-gray-500 disabled:opacity-30 transition-colors"><span class="material-symbols-outlined">arrow_upward</span></button>
           <button @click="moveSlide(1)" :disabled="currentSlideIdx === slides.length - 1" class="p-1.5 border rounded-md hover:bg-gray-50 text-gray-500 disabled:opacity-30 transition-colors"><span class="material-symbols-outlined">arrow_downward</span></button>
        </div>
      </div>
      
      <!-- Form Fields Based on Type -->
      <div class="space-y-6">
        
        <!-- Portada Oscura -->
        <div v-if="currentSlide.type === 'portada_oscura'" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Título Principal</label>
            <input v-model="currentSlide.titulo" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none" type="text" placeholder="Presentación Corporativa">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Subtítulo</label>
            <input v-model="currentSlide.subtitulo" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none" type="text" placeholder="ENAE Business School">
          </div>
        </div>

        <!-- Texto + 2 Fotos -->
        <div v-if="currentSlide.type === 'texto_dos_fotos'" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Título</label>
            <input v-model="currentSlide.titulo" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none" type="text" placeholder="Tu viaje empieza aquí">
          </div>
          
          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Párrafo Izquierda</label>
              <textarea v-model="currentSlide.texto_izq" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none h-32 resize-none"></textarea>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Párrafo Derecha</label>
              <textarea v-model="currentSlide.texto_der" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none h-32 resize-none"></textarea>
            </div>
          </div>
          
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Frase Destacada</label>
            <input v-model="currentSlide.destacado" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none" type="text" placeholder="No vienes únicamente a estudiar...">
          </div>

          <div class="grid grid-cols-2 gap-6 mt-4 p-4 bg-gray-50 rounded-lg border border-gray-100">
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Foto Superior</label>
              <input type="file" @change="uploadImage($event, 'foto1')" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 mb-2">
              <img v-if="currentSlide.foto1" :src="currentSlide.foto1" class="h-24 object-cover rounded shadow-sm w-full mt-2">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Foto Inferior</label>
              <input type="file" @change="uploadImage($event, 'foto2')" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 mb-2">
              <img v-if="currentSlide.foto2" :src="currentSlide.foto2" class="h-24 object-cover rounded shadow-sm w-full mt-2">
            </div>
          </div>
        </div>

        <!-- Texto + Foto Completa -->
        <div v-if="currentSlide.type === 'texto_foto_completa'" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Título</label>
            <input v-model="currentSlide.titulo" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none" type="text">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Texto (Párrafo largo)</label>
            <textarea v-model="currentSlide.texto" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none h-40 resize-none"></textarea>
          </div>
          <div class="p-4 bg-gray-50 rounded-lg border border-gray-100">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Imagen (Mitad derecha)</label>
            <input type="file" @change="uploadImage($event, 'foto')" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 mb-2">
            <img v-if="currentSlide.foto" :src="currentSlide.foto" class="h-32 object-cover rounded shadow-sm mt-2">
          </div>
        </div>

        <!-- Solo Texto Centrado -->
        <div v-if="currentSlide.type === 'solo_texto_centrado'" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Título Gigante</label>
            <textarea v-model="currentSlide.titulo" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none h-24 resize-none font-extrabold text-2xl text-center"></textarea>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Subtexto (Opcional)</label>
            <textarea v-model="currentSlide.texto" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none h-20 resize-none text-center"></textarea>
          </div>
        </div>

        <!-- KPIs / Métricas -->
        <div v-if="currentSlide.type === 'kpis_metricas'" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Título de la sección</label>
            <input v-model="currentSlide.titulo" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-red-200 outline-none" type="text" placeholder="Métricas Clave">
          </div>
          
          <div class="grid grid-cols-2 gap-4 mt-6">
            <div v-for="(kpi, kidx) in currentSlide.kpis" :key="kidx" class="p-4 border rounded-lg bg-gray-50">
              <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Métrica {{kidx + 1}}</label>
              <input v-model="kpi.valor" class="w-full border p-2 rounded mb-2 font-bold text-lg text-center" type="text" placeholder="Dato (ej: 91%)">
              <input v-model="kpi.label" class="w-full border p-2 rounded text-sm text-center" type="text" placeholder="Descripción">
            </div>
          </div>
        </div>

      </div>
    </div>
    
    <div v-else class="flex flex-col h-full items-center justify-center text-gray-400">
      <span class="material-symbols-outlined text-6xl mb-4 opacity-50">web</span>
      <p class="text-lg">Selecciona o añade una diapositiva en el panel lateral</p>
    </div>
  </div>

  <!-- Add Modal -->
  <div v-if="showAddModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md transform transition-all">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h3 class="text-xl font-bold text-gray-800">Añadir Diapositiva</h3>
        <button @click="showAddModal = false" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="space-y-3">
        <button v-for="layout in layouts" @click="addSlide(layout.id)" class="w-full text-left p-4 border border-gray-200 rounded-lg hover:border-red-600 hover:bg-red-50 flex items-center gap-4 transition-colors group">
          <div class="w-10 h-10 rounded-full bg-gray-100 group-hover:bg-red-100 flex items-center justify-center text-gray-600 group-hover:text-red-700 transition-colors">
            <span class="material-symbols-outlined">{{ layout.icon }}</span>
          </div>
          <div>
            <div class="font-bold text-sm text-gray-800 group-hover:text-red-900">{{ layout.name }}</div>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        fileName: new URLSearchParams(window.location.search).get('edit') || null,
        slides: [],
        currentSlideIdx: null,
        showAddModal: false,
        layouts: [
          { id: 'portada_oscura', name: 'Portada Oscura', icon: 'title' },
          { id: 'texto_dos_fotos', name: 'Texto + 2 Fotos', icon: 'view_quilt' },
          { id: 'texto_foto_completa', name: 'Texto + Foto Completa', icon: 'view_sidebar' },
          { id: 'solo_texto_centrado', name: 'Texto Destacado (Centrado)', icon: 'format_align_center' },
          { id: 'kpis_metricas', name: 'Cuadrícula de Métricas', icon: 'query_stats' }
        ]
      }
    },
    computed: {
      currentSlide() {
        if (this.currentSlideIdx === null || this.currentSlideIdx >= this.slides.length) return null;
        return this.slides[this.currentSlideIdx];
      }
    },
    mounted() {
      if (this.fileName) {
        this.loadPresentation();
      } else {
        this.slides = [{ type: 'portada_oscura', titulo: 'Nueva Presentación', subtitulo: 'ENAE Business School' }];
        this.currentSlideIdx = 0;
      }
    },
    methods: {
      getLayoutName(id) {
        const l = this.layouts.find(x => x.id === id);
        return l ? l.name : id;
      },
      async loadPresentation() {
        try {
          const res = await fetch('/presentaciones/' + this.fileName);
          const html = await res.text();
          const match = html.match(/<script id="presentacion-data" type="application\/json">([\s\S]*?)<\/script>/);
          if (match) {
            const data = JSON.parse(match[1]);
            this.slides = data.slides || [];
            if (this.slides.length > 0) this.currentSlideIdx = 0;
          }
        } catch (e) {
          console.error('Error loading presentation', e);
        }
      },
      addSlide(type) {
        const newSlide = { type: type, titulo: '' };
        if (type === 'kpis_metricas') {
          newSlide.kpis = [
            { valor: '91%', label: 'Empleabilidad' },
            { valor: '1', label: 'Ranking' },
            { valor: '+10k', label: 'Alumnos' },
            { valor: '1988', label: 'Fundación' }
          ];
        }
        this.slides.push(newSlide);
        this.currentSlideIdx = this.slides.length - 1;
        this.showAddModal = false;
      },
      removeSlide(idx) {
        if(!confirm('¿Eliminar esta diapositiva?')) return;
        this.slides.splice(idx, 1);
        if (this.currentSlideIdx >= this.slides.length) {
          this.currentSlideIdx = this.slides.length - 1;
        }
        if (this.slides.length === 0) this.currentSlideIdx = null;
      },
      moveSlide(dir) {
        const idx = this.currentSlideIdx;
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= this.slides.length) return;
        const temp = this.slides[idx];
        this.slides[idx] = this.slides[newIdx];
        this.slides[newIdx] = temp;
        this.currentSlideIdx = newIdx;
      },
      async uploadImage(event, field) {
        const file = event.target.files[0];
        if (!file) return;
        
        const formData = new FormData();
        formData.append('imagen', file);
        formData.append('slot', field);
        
        try {
          const res = await fetch('/api/upload-image', {
            method: 'POST',
            body: formData
          });
          const result = await res.json();
          if (result.success) {
            this.currentSlide[field] = result.relPath;
          } else {
            alert('Error al subir imagen: ' + result.error);
          }
        } catch(e) {
          alert('Error de conexión al subir imagen');
        }
      },
      async savePresentation() {
        let name = prompt("Nombre del archivo (sin .html):", this.fileName ? this.fileName.replace('.html','') : "presentacion-" + Date.now());
        if (!name) return;
        if (!name.endsWith('.html')) name += '.html';
        
        const payload = {
          nombre: name,
          programa: name.replace('.html',''), // Used by server.js buildMixedTitle
          slides: this.slides
        };
        
        try {
          const res = await fetch('/api/presentaciones', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (result.success) {
            window.location.href = '/manager.html';
          } else {
            alert('Error al guardar: ' + result.error);
          }
        } catch (e) {
          alert('Error de red al guardar');
        }
      }
    }
  }).mount('#app');
</script>
</body>
</html>
